[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockresearchmarket"
version = "0.1.0"
description = "Research lab for long-horizon stock-market strategy backtests."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "PyYAML>=6",
  "typer>=0.12",
  "rich>=13.7",
  "plotly>=5.22",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "pandas-datareader>=0.10",
  "optuna>=3.6",
  "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
stockresearch = "stockresearchmarket.cli:app"

[tool.setuptools.packages.find]
include = ["stockresearchmarket*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
